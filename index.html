<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>湖南大学 Robot 工作坊 招新与培训知识门户</title>
  <meta name="description" content="湖南大学现代工程训练中心 Robot 工作坊官方新生指南、历年归档与寒假精英训练营技术文档门户。">

  <!-- 第三方库：精确锁定生产版本 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljs-theme">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

  <style>
    /* ==========================================
       设计系统 Tokens：纸书级经典出版物排版体系
       ========================================== */
    :root, [data-theme="paper"] {
      --bg-page: #fbfbfa;
      --bg-surface: #ffffff;
      --bg-elevated: #f4f4f2;
      --bg-drawer: rgba(251, 251, 250, 0.94);
      --border-subtle: #e7e5e4;
      --border-accent: #881337;
      
      --text-main: #1c1917;
      --text-muted: #57534e;
      --text-dim: #78716c;
      
      --color-academic: #881337;
      --color-academic-soft: rgba(136, 19, 55, 0.08);
      --color-accent: #0284c7;
      --color-badge: #d97706;
      
      --booktabs-rule: #1c1917;
      --shadow-dock: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.04);
      --reader-width: 820px;
    }

    [data-theme="night"] {
      --bg-page: #0f141c;
      --bg-surface: #151b26;
      --bg-elevated: #1e2638;
      --bg-drawer: rgba(15, 20, 28, 0.94);
      --border-subtle: #242f44;
      --border-accent: #fb7185;
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --color-academic: #fb7185;
      --color-academic-soft: rgba(251, 113, 133, 0.12);
      --color-accent: #38bdf8;
      --color-badge: #f59e0b;
      
      --booktabs-rule: #cbd5e1;
      --shadow-dock: 0 10px 30px rgba(0, 0, 0, 0.4);
      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.78;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    /* 衬线学术标题字体 */
    .font-serif {
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", Georgia, serif;
    }

    /* 顶部紧凑页眉 */
    header.academic-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-drawer);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-stamp {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      object-fit: cover;
    }

    .brand-title {
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .doc-picker-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .doc-select {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px 28px 4px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      appearance: none;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .doc-select:hover {
      border-color: var(--color-academic);
    }

    .select-arrow {
      position: absolute;
      right: 9px;
      pointer-events: none;
      color: var(--text-dim);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      color: var(--text-main);
      background: var(--bg-elevated);
      border-color: var(--text-dim);
    }

    /* 本地协议运行提示条 */
    #protocol-banner {
      display: none;
      background: #fef3c7;
      border-bottom: 1px solid #fde68a;
      color: #92400e;
      padding: 8px 32px;
      font-size: 13px;
      align-items: center;
      justify-content: space-between;
    }

    #protocol-banner code {
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* 居中单栏长卷容器 */
    main.academic-reader {
      max-width: var(--reader-width);
      margin: 0 auto;
      padding: 48px 24px 120px 24px;
    }

    /* 论文级卷首 */
    .paper-masthead {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 28px;
    }

    .paper-org-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--color-academic);
      margin-bottom: 10px;
    }

    .paper-title {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-main);
      margin-bottom: 14px;
    }

    .paper-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      font-size: 13.5px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .meta-tag-pill {
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--color-academic-soft);
      color: var(--color-academic);
      font-weight: 600;
      border: 1px solid rgba(136, 19, 55, 0.2);
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .meta-tag-pill:hover {
      background: var(--color-academic);
      color: #ffffff;
      text-decoration: none;
    }

    /* 快速官方原件下载条 */
    .paper-actions-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px 16px;
      box-shadow: var(--shadow-card);
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-academic);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .action-link:hover {
      text-decoration: underline;
    }

    .action-divider {
      color: var(--border-subtle);
    }

    /* Markdown 正文排版 */
    .academic-prose {
      color: var(--text-main);
    }

    .academic-prose h1,
    .academic-prose h2,
    .academic-prose h3,
    .academic-prose h4 {
      font-family: "Palatino Linotype", "Book Antiqua", Palatino, "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
      color: var(--text-main);
      font-weight: 700;
      margin-top: 1.8em;
      margin-bottom: 0.6em;
      line-height: 1.35;
      scroll-margin-top: 80px;
    }

    .academic-prose h1 {
      font-size: 26px;
      border-bottom: 1.5px solid var(--border-subtle);
      padding-bottom: 0.3em;
    }

    .academic-prose h2 {
      font-size: 22px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.25em;
    }

    .academic-prose h3 {
      font-size: 18px;
    }

    .academic-prose p {
      margin-bottom: 1.25em;
      text-align: justify;
    }

    .academic-prose a {
      color: var(--color-academic);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .academic-prose a:hover {
      opacity: 0.8;
    }

    .academic-prose ul,
    .academic-prose ol {
      margin-bottom: 1.3em;
      padding-left: 28px;
    }

    .academic-prose li {
      margin-bottom: 0.4em;
    }

    /* ClassicThesis 学术提示框 */
    .academic-prose blockquote {
      margin: 1.6em 0;
      padding: 14px 20px;
      background: var(--bg-surface);
      border-left: 3.5px solid var(--color-academic);
      border-radius: 0 6px 6px 0;
      border-top: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 15px;
    }

    /* 学术三线表 (Booktabs) */
    .academic-prose table {
      width: 100%;
      margin: 2em 0;
      border-collapse: collapse;
      font-size: 14.5px;
      border-top: 2px solid var(--booktabs-rule);
      border-bottom: 2px solid var(--booktabs-rule);
    }

    .academic-prose th,
    .academic-prose td {
      padding: 10px 14px;
      text-align: left;
      border: none;
    }

    .academic-prose th {
      font-weight: 700;
      border-bottom: 1px solid var(--booktabs-rule);
      color: var(--text-main);
    }

    .academic-prose tr:hover {
      background: var(--color-academic-soft);
    }

    /* 图片与学术题注 */
    .academic-prose img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      display: block;
      margin: 1.8em auto 0.6em auto;
      border: 1px solid var(--border-subtle);
    }

    /* 代码块与代码标签 */
    .academic-prose code {
      font-family: "SF Mono", Menlo, Consolas, Monaco, monospace;
      font-size: 13.5px;
      background: var(--bg-elevated);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--color-academic);
    }

    .academic-prose pre {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 14px 18px;
      margin: 1.6em 0;
      overflow-x: auto;
      position: relative;
    }

    .academic-prose pre code {
      background: transparent;
      padding: 0;
      color: var(--text-main);
    }

    /* 右下角极简悬浮交互底座 (Floating Dock) */
    .floating-dock {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 80;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-drawer);
      backdrop-filter: blur(16px);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-dock);
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .dock-btn:hover {
      color: var(--text-main);
      background: var(--bg-elevated);
    }

    .dock-btn.active {
      color: var(--color-academic);
      background: var(--color-academic-soft);
    }

    /* 侧边滑动大纲抽屉 (Outline Drawer) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    aside.outline-drawer {
      position: fixed;
      top: 0;
      right: -360px;
      width: 340px;
      height: 100vh;
      z-index: 100;
      background: var(--bg-surface);
      border-left: 1px solid var(--border-subtle);
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.1);
      padding: 24px 20px;
      overflow-y: auto;
      transition: right 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    aside.outline-drawer.open {
      right: 0;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .drawer-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }

    .drawer-close {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-dim);
      padding: 4px;
    }

    .drawer-close:hover {
      color: var(--text-main);
    }

    .drawer-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .drawer-nav-link {
      display: block;
      padding: 6px 10px;
      font-size: 13.5px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 4px;
      line-height: 1.4;
      transition: all 0.15s ease;
    }

    .drawer-nav-link:hover {
      color: var(--text-main);
      background: var(--bg-elevated);
    }

    .drawer-nav-link.active {
      color: var(--color-academic);
      font-weight: 600;
      background: var(--color-academic-soft);
    }

    .drawer-nav-link.depth-3 {
      padding-left: 22px;
      font-size: 12.5px;
    }

    @media (max-width: 640px) {
      header.academic-header {
        padding: 0 16px;
      }
      main.academic-reader {
        padding: 24px 16px 100px 16px;
      }
      .paper-title {
        font-size: 24px;
      }
      .floating-dock {
        bottom: 16px;
        right: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部极简页眉 -->
  <header class="academic-header">
    <div class="header-left">
      <a href="#" class="brand-stamp">
        <img src="docs/2026/freshman/assets/RobotWorkShop.jpg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <span class="brand-title">湖南大学 Robot 工作坊</span>
      </a>

      <!-- 快速篇目切换选择器 -->
      <div class="doc-picker-wrapper">
        <select id="doc-selector" class="doc-select" aria-label="选择阅读文档"></select>
        <span class="select-arrow">▾</span>
      </div>
    </div>

    <div class="header-right">
      <!-- 主题切换 (日间/夜间) -->
      <button id="btn-theme" class="icon-btn" title="切换阅读主题 (按键 T)">
        <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>

      <!-- 仓库外链 -->
      <a id="repo-link" href="https://github.com/RobotWorkShop-BigHeroX/FreshmanGuide" target="_blank" rel="noopener noreferrer" class="icon-btn" title="查看 GitHub 仓库">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
    </div>
  </header>

  <!-- 本地文件环境提示条 -->
  <div id="protocol-banner">
    <div>
      本地文件直接读取受浏览器安全策略限制。若无法渲染正文，请在终端执行 <code>python -m http.server 8000</code> 后访问 <code>http://localhost:8000/</code>。
    </div>
    <button style="background:none; border:none; cursor:pointer; font-size:12px; font-weight:600;" onclick="document.getElementById('protocol-banner').style.display='none'">关闭</button>
  </div>

  <!-- 居中长卷阅读主体 -->
  <main class="academic-reader">
    <!-- 论文级卷首 -->
    <header class="paper-masthead" id="paper-head">
      <div class="paper-org-label font-serif" id="masthead-org">HUNAN UNIVERSITY · ROBOT WORKSHOP</div>
      <h1 class="paper-title font-serif" id="masthead-title">加载中...</h1>
      <div class="paper-meta-row">
        <a class="meta-tag-pill" id="masthead-tag" href="#" target="_blank" rel="noopener noreferrer">Release</a>
        <span id="masthead-date">发布时间</span>
        <span id="masthead-updated">更新时间</span>
      </div>

      <!-- 原件与附件快捷下载条 -->
      <div class="paper-actions-bar" id="actions-bar">
        <a id="btn-pdf-download" href="#" download class="action-link">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span id="pdf-download-text">下载官方原件 PDF</span>
        </a>
      </div>
    </header>

    <!-- Markdown 正文渲染区 -->
    <article class="academic-prose" id="article-prose">
      <p style="text-align: center; color: var(--text-dim); padding: 60px 0;">正在加载学术文档正文...</p>
    </article>
  </main>

  <!-- 右下角悬浮交互底座 (Floating Dock) -->
  <div class="floating-dock">
    <button id="btn-toggle-outline" class="dock-btn" title="打开章节目录大纲">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span>目录大纲</span>
    </button>
    <button id="btn-back-to-top" class="dock-btn" title="回到顶部" style="display: none;" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
      <span>置顶</span>
    </button>
  </div>

  <!-- 滑动大纲抽屉 -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="outline-drawer" class="outline-drawer">
    <div class="drawer-header">
      <span class="drawer-title">章节目录大纲</span>
      <button id="btn-close-drawer" class="drawer-close" title="关闭大纲 (Esc)">✕</button>
    </div>
    <ul id="drawer-nav-list" class="drawer-nav-list">
      <li style="color: var(--text-dim); font-size: 13px;">暂无标题</li>
    </ul>
  </aside>

  <script>
    // 1. 全局状态
    let catalog = null;
    let currentDoc = null;

    // 2. 环境协议检测
    if (window.location.protocol === 'file:') {
      const banner = document.getElementById('protocol-banner');
      if (banner) banner.style.display = 'flex';
    }

    // 3. 相对路径重定位解析器
    function resolveAssetUrl(src, markdownPath) {
      if (!src) return '';
      if (/^(https?:)?\/\//i.test(src) || src.startsWith('data:')) {
        return src;
      }
      const lastSlash = markdownPath.lastIndexOf('/');
      const baseDir = lastSlash !== -1 ? markdownPath.substring(0, lastSlash + 1) : '';
      let cleanSrc = src.startsWith('./') ? src.substring(2) : src;
      return baseDir + cleanSrc;
    }

    // 4. Marked 配置与 DOMPurify 安全净化管道
    const renderer = new marked.Renderer();

    renderer.image = function(href, title, text) {
      let src = typeof href === 'object' ? href.href : href;
      let imgTitle = typeof href === 'object' ? href.title : title;
      let altText = typeof href === 'object' ? href.text : text;

      if (currentDoc && currentDoc.markdownPath) {
        src = resolveAssetUrl(src, currentDoc.markdownPath);
      }
      return `<figure style="text-align:center; margin: 2em 0;">
                <img src="${src}" alt="${altText || ''}" title="${imgTitle || ''}">
                ${altText ? `<figcaption style="font-size: 13px; color: var(--text-dim); margin-top: 6px;">图：${altText}</figcaption>` : ''}
              </figure>`;
    };

    renderer.link = function(href, title, text) {
      let targetHref = typeof href === 'object' ? href.href : href;
      let linkTitle = typeof href === 'object' ? href.title : title;
      let linkText = typeof href === 'object' ? href.text : text;

      if (/^(https?:)?\/\//i.test(targetHref)) {
        return `<a href="${targetHref}" target="_blank" rel="noopener noreferrer" title="${linkTitle || ''}">${linkText}</a>`;
      }
      return `<a href="${targetHref}" title="${linkTitle || ''}">${linkText}</a>`;
    };

    marked.setOptions({
      renderer: renderer,
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(code, { language: lang }).value;
          } catch (_) {}
        }
        return hljs.highlightAuto(code).value;
      },
      gfm: true,
      breaks: true
    });

    // 5. 初始化读取 catalog.json
    async function initCatalog() {
      try {
        const res = await fetch('catalog.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        catalog = await res.json();

        setupDocSelector(catalog);

        const hashId = window.location.hash.replace(/^#/, '');
        loadDocument(hashId || catalog.defaultDocId);
      } catch (err) {
        console.error('Failed to load catalog:', err);
        const article = document.getElementById('article-prose');
        article.innerHTML = `
          <div style="background: rgba(136,19,55,0.06); border: 1px solid rgba(136,19,55,0.2); padding: 24px; border-radius: 6px;">
            <h3 style="color: var(--color-academic); margin-top:0;">元数据清单加载受阻</h3>
            <p>无法成功读取 <code>catalog.json</code> 清单配置。</p>
            <p style="font-size: 13px; color: var(--text-dim); margin-top: 8px;">
              若正在本地预览，请在终端执行 <code>python -m http.server 8000</code> 后访问 <code>http://localhost:8000/</code>。
            </p>
          </div>
        `;
      }
    }

    // 6. 配置篇目下拉选择器
    function setupDocSelector(data) {
      const select = document.getElementById('doc-selector');
      select.innerHTML = '';

      data.categories.forEach(cat => {
        const group = document.createElement('optgroup');
        group.label = cat.name;

        cat.items.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = `${item.year} · ${item.title}`;
          group.appendChild(opt);
        });

        select.appendChild(group);
      });

      select.addEventListener('change', (e) => {
        loadDocument(e.target.value);
      });
    }

    // 7. 加载并渲染文档
    async function loadDocument(docId) {
      if (!catalog) return;
      let targetItem = null;
      for (const cat of catalog.categories) {
        for (const it of cat.items) {
          if (it.id === docId) {
            targetItem = it;
            break;
          }
        }
        if (targetItem) break;
      }
      if (!targetItem) targetItem = catalog.categories[0].items[0];

      currentDoc = targetItem;
      window.location.hash = targetItem.id;

      // 同步选择器选项
      const select = document.getElementById('doc-selector');
      if (select) select.value = targetItem.id;

      // 更新卷首元数据
      document.getElementById('masthead-title').textContent = targetItem.title;
      const mastheadTag = document.getElementById('masthead-tag');
      mastheadTag.textContent = `${targetItem.releaseTag} · ${targetItem.badge}`;
      mastheadTag.href = `https://github.com/RobotWorkShop-BigHeroX/FreshmanGuide/releases/tag/${targetItem.releaseTag}`;
      mastheadTag.title = `前往 GitHub 查看 ${targetItem.releaseTag} 发行版本与产物`;
      document.getElementById('masthead-date').textContent = `首发: ${targetItem.publishDate}`;
      document.getElementById('masthead-updated').textContent = `更新: ${targetItem.updatedAt || targetItem.publishDate}`;

      // 更新操作栏所有快捷链接
      const actionsBar = document.getElementById('actions-bar');
      // 保留第一个基础 PDF 按钮，移除后续所有动态子节点
      while (actionsBar.children.length > 1) {
        actionsBar.removeChild(actionsBar.lastChild);
      }

      // 1. PDF 下载入口
      const btnPdf = document.getElementById('btn-pdf-download');
      btnPdf.href = targetItem.pdfPath;
      btnPdf.download = targetItem.pdfPath.split('/').pop();
      document.getElementById('pdf-download-text').textContent = `下载原件 PDF (${targetItem.pdfSize || ''})`;

      function appendActionLink(iconSvg, text, href, isDownload = false) {
        const divider = document.createElement('span');
        divider.className = 'action-divider';
        divider.textContent = '|';
        actionsBar.appendChild(divider);

        const a = document.createElement('a');
        a.className = 'action-link';
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        if (isDownload) a.download = '';
        a.innerHTML = `${iconSvg} <span>${text}</span>`;
        actionsBar.appendChild(a);
      }

      // 2. 配套大文件附件包 (若该篇目存在)
      if (targetItem.attachmentUrl) {
        appendActionLink(
          `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>`,
          `下载配套附件包 (${targetItem.attachmentSize || 'ZIP'})`,
          targetItem.attachmentUrl,
          true
        );
      }

      // 3. Release 官方发行版本页面
      appendActionLink(
        `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>`,
        `Release 发行页面 (${targetItem.releaseTag})`,
        `https://github.com/RobotWorkShop-BigHeroX/FreshmanGuide/releases/tag/${targetItem.releaseTag}`
      );

      // 4. GitHub 上的 Markdown 源码与版本历史
      appendActionLink(
        `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>`,
        `查阅 Markdown 源码`,
        `https://github.com/RobotWorkShop-BigHeroX/FreshmanGuide/blob/main/${targetItem.markdownPath}`
      );

      // 请求正文并安全渲染
      const prose = document.getElementById('article-prose');
      prose.innerHTML = '<p style="text-align: center; color: var(--text-dim); padding: 60px 0;">加载学术长卷中...</p>';

      try {
        const res = await fetch(targetItem.markdownPath);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const mdText = await res.text();

        // 执行解析并通过 DOMPurify 净化
        const cleanHtml = DOMPurify.sanitize(marked.parse(mdText), {
          ADD_ATTR: ['target', 'rel']
        });

        prose.innerHTML = cleanHtml;
        window.scrollTo({ top: 0, behavior: 'instant' });

        // 构建大纲抽屉结构
        buildOutlineDrawer(prose);
      } catch (err) {
        console.error('Failed to load markdown text:', err);
        prose.innerHTML = `
          <div style="background: rgba(136,19,55,0.06); border: 1px solid rgba(136,19,55,0.2); padding: 20px; border-radius: 6px;">
            <h4 style="color: var(--color-academic); margin-top:0;">正文读取未成功</h4>
            <p>无法访问路径：<code>${targetItem.markdownPath}</code>。</p>
          </div>
        `;
      }
    }

    // 8. 构建大纲抽屉
    function buildOutlineDrawer(articleEl) {
      const list = document.getElementById('drawer-nav-list');
      list.innerHTML = '';

      const headings = articleEl.querySelectorAll('h2, h3');
      if (headings.length === 0) {
        list.innerHTML = '<li style="color: var(--text-dim); font-size: 13px;">本篇未设置二级标题</li>';
        return;
      }

      headings.forEach((heading, idx) => {
        if (!heading.id) heading.id = `section-${idx}`;

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'drawer-nav-link' + (heading.tagName === 'H3' ? ' depth-3' : '');
        a.href = `#${heading.id}`;
        a.textContent = heading.textContent.replace(/^#+\s*/, '');
        a.onclick = (e) => {
          e.preventDefault();
          closeDrawer();
          heading.scrollIntoView({ behavior: 'smooth' });
        };

        li.appendChild(a);
        list.appendChild(li);
      });
    }

    // 9. 抽屉与浮动底座控制
    const drawer = document.getElementById('outline-drawer');
    const overlay = document.getElementById('drawer-overlay');
    const btnToggle = document.getElementById('btn-toggle-outline');
    const btnClose = document.getElementById('btn-close-drawer');

    function openDrawer() {
      drawer.classList.add('open');
      overlay.classList.add('open');
      btnToggle.classList.add('active');
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('open');
      btnToggle.classList.remove('active');
    }

    btnToggle.addEventListener('click', () => {
      if (drawer.classList.contains('open')) closeDrawer();
      else openDrawer();
    });

    btnClose.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    // 10. 滚动监控（置顶按钮显隐）
    const btnTop = document.getElementById('btn-back-to-top');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        btnTop.style.display = 'inline-flex';
      } else {
        btnTop.style.display = 'none';
      }
    });

    // 11. 主题切换逻辑
    const btnTheme = document.getElementById('btn-theme');
    const hljsTheme = document.getElementById('hljs-theme');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('robot-reader-theme', theme);

      if (theme === 'night') {
        hljsTheme.href = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css';
      } else {
        hljsTheme.href = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css';
      }
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'paper';
      setTheme(cur === 'paper' ? 'night' : 'paper');
    }

    btnTheme.addEventListener('click', toggleTheme);

    // 快捷键支持 (T 键切主题，Esc 关闭抽屉)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 't' || e.key === 'T') {
        toggleTheme();
      } else if (e.key === 'Escape') {
        closeDrawer();
      }
    });

    // 恢复偏好主题
    const savedTheme = localStorage.getItem('robot-reader-theme');
    if (savedTheme) setTheme(savedTheme);

    // 12. 监听 hash 变动
    window.addEventListener('hashchange', () => {
      const hashId = window.location.hash.replace(/^#/, '');
      if (hashId && (!currentDoc || currentDoc.id !== hashId)) {
        loadDocument(hashId);
      }
    });

    // 启动
    document.addEventListener('DOMContentLoaded', initCatalog);
  </script>
</body>
</html>
